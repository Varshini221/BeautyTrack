<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discover - BeautyTrack</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>BeautyTrack</h1>

        <nav>
            <a href="index.html">My Appointments</a>
            <a href="discover.html">Discover</a>
        </nav>
    </header>


    <main>

        <section>
            <h2>Discover Nearby Businesses</h2>

            <label for="service">Service:</label>

            <select id="service">
                <option value="">Choose a service</option>
                <option value="beauty_salon">Waxing</option>
                <option value="nail_salon">Nails</option>
                <option value="hair_salon">Hair</option>
            </select>


            <label for="distance">Distance:</label>

            <select id="distance">
                <option value="5">Within 5 km</option>
                <option value="10">Within 10 km</option>
                <option value="20">Within 20 km</option>
            </select>


            <button id="search-businesses" onclick="showPlaces()">Search</button>
        </section>


        <section id="businesses">

            <h3>Nearby Businesses</h3>
            <div id="nearby-businesses"></div>
            <!-- Businesses will be added here with JavaScript -->

        </section>

    </main>


    <footer>
        <p>© 2026 BeautyTrack</p>
    </footer>


    <script src="discover.js"></script>

</body>
</html>
